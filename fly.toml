# Fly.io deployment. See doc/PLAN.md, "Hosting advice".
app = "photopiler"
primary_region = "iad"

[build]
  # Uses the Dockerfile.

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so no visitor waits for a cold start (about 7 s). This costs
  # about $6.64/month. To pay only while in use instead, set
  # auto_stop_machines = "stop" and min_machines_running = 0.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # A heavy render uses about 250 MB, so keep concurrent requests low on a
  # 1 GB machine; extra requests wait in line.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
